<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование продукта</title>
</head>
<body>
    <div>
        <h1>Редактирование продукта</h1>

        <form action="/edit/{{ product_id }}" method="POST">
            <label>Название:</label>
            <input type="text" name="food" value="{{ product['nazvanie'] }}">
            
            <label>Количество:</label>
            <input type="number" step="any" name="kolvo" value="{{ product['kolichestvo'] }}">
        
            <label>Единица измерения:</label>
            <input type="text" name="meraizmerenia" value="{{ product['meraizmerenia'] }}">
            
            <button type="submit">Сохранить</button>
        </form>
    </div>
</body>
</html>
